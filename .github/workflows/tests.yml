name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify compiler
        run: python -m unittest discover -s tests -v
      - name: Build the known working example
        run: python g1m_compiler.py build examples/BLOK112.txt --name BLOK112 --output output/BLOK112.g1m
